name = "anfragen-bruecke"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Taeglicher Herzschlag: prueft, ob seit zu langer Zeit nichts angekommen ist.
# Eine Bruecke, die still ausfaellt, ist schlimmer als keine.
[triggers]
crons = ["0 9 * * *"]

# Protokollhaltung.
#
# Ohne sie sieht von der Bruecke nur, wer in genau dem Moment ein
# `wrangler tail` offen hat. Eine Anfrage, die nachts um halb elf schiefgeht,
# waere damit nicht rekonstruierbar -- und bei einem System, dessen einziger
# stiller Fehler eine nicht zugestellte Reservierung ist, ist das die falsche
# Ausfallrichtung.
#
# Mit ihr bleiben die Zeilen abfragbar, auch rueckwirkend.
[observability]
enabled = true

# Alarmkanal: Stoerungsmeldungen an den Betreiber.
#
# Das Binding darf nur an *verifizierte* Zieladressen dieses Accounts senden
# (Email Routing > Destination addresses). Welche davon es wird, sagt das
# Secret BETREIBER_MAIL. Deshalb steht hier bewusst keine Adresse: Die
# Bruecke bedient mehrere Kunden, und eine fest eingetragene Mailadresse
# waere beim naechsten die falsche.
#
# Fehlt das Binding, faellt die Meldung auf Resend zurueck; fehlt auch das,
# bleibt sie im Protokoll. Siehe Kopf von betreiberMelden in kanaele.js.
[[send_email]]
name = "MELDUNG"

# Zustand (letzte Mail, letzter Fehler, Zaehler).
# Optional: Fehlt die Bindung, laeuft die Bruecke trotzdem, nur ohne Gedaechtnis.
# Anlegen mit:  npx wrangler kv namespace create ZUSTAND
# [[kv_namespaces]]
# binding = "ZUSTAND"
# id = "HIER_DIE_ID_EINTRAGEN"

# Was NICHT hier steht, und warum das wichtig ist.
#
# Wrangler behandelt diese Datei als Quelle der Wahrheit fuer `[vars]`: Beim
# naechsten `wrangler deploy` schreibt es den Block unten und **loescht jede
# Variable, die hier nicht aufgefuehrt ist**. Was im Dashboard nachgetragen
# wurde, ist danach weg.
#
# Alles Folgende gehoert deshalb als *Secret* in die Umgebung und niemals in
# diese Datei. Secrets fasst Wrangler beim Deploy nicht an:
#
#   ABSENDER_MAIL          Absender der Stoerungsmeldungen
#   BETREIBER_MAIL         verifizierte Zieladresse fuer Stoerungsmeldungen
#   WHATSAPP_TOKEN         Zugriffstoken des Meta-Systemnutzers
#   WHATSAPP_TELEFON_ID    Phone Number ID des Geschaeftskontos
#   WHATSAPP_VORLAGE       Name der genehmigten Nachrichtenvorlage
#   WHATSAPP_SPRACHE       Sprachcode der Vorlage
#   RESEND_TOKEN           Ausweichweg fuer Meldungen, falls MELDUNG fehlt
#   STATUS_SCHLUESSEL      Schluessel der Statusabfrage
#   TELEGRAM_TOKEN         nur fuer den Ausweichkanal
#   TELEGRAM_CHAT          nur fuer den Ausweichkanal
#
# Dazu je Kunde die Empfaengerkennung, benannt in `konfiguration.js` unter
# `ziel.whatsapp` -- derzeit WHATSAPP_NUMMER_KOSTA.
#
# **Diese eine faellt beim Suchen durch.** Alle anderen Werte stehen als
# `env.NAME` im Quelltext und sind auffindbar; die Empfaengerkennung wird
# ueber `env[ziel.whatsapp]` dynamisch nachgeschlagen und taucht deshalb in
# keinem grep auf. Wer sie versehentlich als Variable statt als Secret
# anlegt, verliert sie beim naechsten Deploy und findet im Code keinen
# Hinweis darauf, dass sie je existiert hat. Der Worker sendet dann an die
# Zeichenkette "WHATSAPP_NUMMER_KOSTA", Meta lehnt ab, und beim Betrieb
# klingelt nichts mehr.
#
# Ausserdem ist eine Rufnummer ein personenbezogenes Datum und gehoert aus
# diesem Grund ohnehin nicht in ein Repository.

[vars]
# Nicht geheim. Geheimes kommt ueber `wrangler secret put`.
KANAL = "whatsapp"        # "whatsapp" im Betrieb, "telegram" nur als Ausweichweg
BETRIEBSMODUS = "scharf"    # "scharf" = zustellen, "probe" = nur protokollieren
STILLE_STUNDEN = "24"       # Herzschlag meldet sich nach so vielen Stunden ohne Mail
